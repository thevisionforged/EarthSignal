[project]
name = "earthsignal"
version = "0.1.0"
description = "EarthSignal backend: NASA data acquisition, provenance, analysis and API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earthsignal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test hits a live external API (deselect with -m 'not network')"]
addopts = "-m 'not network'"
